<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARTA NOORI STUDIO</title>
<meta name="description" content="ARTA NOORI STUDIO: ad films built on ideas, editing and VFX. Walk through a 3D studio of brand films for Respina, Mixland, U Collective and more.">
<meta property="og:title" content="ARTA NOORI STUDIO">
<meta property="og:description" content="Ad films built on ideas, editing and VFX.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/logo-white.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="assets/logo-black.png" media="(prefers-color-scheme: light)">
<script>
/* set light/dark before first paint so the loader matches the saved choice */
(function(){var t=null;try{t=localStorage.getItem("ans-theme")}catch(e){}
var d=t?t==="dark":!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",d?"dark":"light")})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="ovl"></div>

<header class="hud">
  <button class="mini glass" id="home" aria-label="ARTA NOORI"><img class="logo-w" src="assets/logo-white.png" alt="ARTA NOORI"><img class="logo-b" src="assets/logo-black.png" alt="ARTA NOORI"></button>
  <div class="r">
    <button class="pill glass" id="langBtn"></button>
    <button class="pill glass" id="lightBtn"></button>
  </div>
</header>
<nav class="map glass" id="map" aria-label="Studio map"></nav>
<div class="hint" id="hint"></div>
<button class="enter-btn glass" id="enterBtn"></button>
<div class="lookctl" id="lookCtl" aria-label="Look up or down"><button class="glass" id="lookUp" aria-label="Look up">▲</button><button class="glass" id="lookReset" aria-label="Reset view">●</button><button class="glass" id="lookDown" aria-label="Look down">▼</button></div>

<div class="shud" id="shud">
  <div class="top"><button class="pill glass" id="back"></button><span class="pill glass" id="stitle" style="cursor:default"></span></div>
  <p class="tip" id="stip"></p>
  <div class="bot"><button class="pill glass" id="sprev"></button><button class="pill glass" id="snext"></button></div>
</div>

<div class="veil" id="veil" role="dialog" aria-modal="true">
  <div class="sheet glass" id="sheet"><button class="x" id="sheetX" aria-label="Close">✕</button><div id="sheetBody"></div></div>
</div>
<div class="fade" id="fade"></div>
<div class="loader" id="loader"><div><img class="logo-w" src="assets/logo-white.png" alt=""><img class="logo-b" src="assets/logo-black.png" alt=""><p id="loadTxt">Lighting the set</p></div></div>
<div class="fallback" id="fallback"><div><p id="fbTxt"></p></div></div>

<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/RoomEnvironment.js"></script>
<script src="vendor/three/CopyShader.js"></script>
<script src="vendor/three/LuminosityHighPassShader.js"></script>
<script src="vendor/three/EffectComposer.js"></script>
<script src="vendor/three/RenderPass.js"></script>
<script src="vendor/three/ShaderPass.js"></script>
<script src="vendor/three/UnrealBloomPass.js"></script>
<script src="vendor/three/Reflector.js"></script>
<script src="vendor/three/BufferGeometryUtils.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
